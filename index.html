<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Generator & Player</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: none; background: #333; color: white; }
        button { width: 49%; padding: 12px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .gen-btn { background: #e50914; color: white; }
        .copy-btn { background: #444; color: white; }
        textarea { width: 100%; height: 150px; margin-top: 20px; padding: 10px; font-family: monospace; font-size: 12px; background: #000; color: #0f0; border: 1px solid #444; }
        #previewArea { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>All-in-One Stream Generator</h2>
    <input type="text" id="streamInput" placeholder="Enter ID (e.g. 54) or full URL...">
    <button class="gen-btn" onclick="generateAndLoad()">Generate & Load Preview</button>
    <button class="copy-btn" onclick="copyToClipboard()">Copy Code</button>
    
    <textarea id="output" readonly placeholder="Generated code will appear here..."></textarea>

    <div id="previewArea">
        <h3>Live Preview</h3>
        <div id="playerContainer"></div>
    </div>
</div>

<script>
    function generateAndLoad() {
        const input = document.getElementById('streamInput').value;
        const match = input.match(/(\d+)\.php/);
        const id = match ? match[1] : input.replace(/\D/g, '');
        
        if(!id) return alert("Please enter a valid Stream ID or URL");

        const streamUrl = `https://dlhd.pk/stream/stream-${id}.php`;
        
        // 1. Generate the Code
        const fullCode = `<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Player</title>
<style>
.tv-player-container * { margin: 0; padding: 0; box-sizing: border-box; }
.tv-player-wrapper { font-family: Arial, sans-serif; background-color: #0d0d0d; color: #fff; padding: 20px; max-width: 1200px; margin: 20px auto; }
.tv-player-container { width: 100%; background-color: #1a1a1a; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
.tv-player-header { background: linear-gradient(135deg, #e50914 0%, #b20710 100%); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.tv-player-header h1 { font-size: 20px; color: #fff; display: flex; align-items: center; gap: 10px; margin: 0; }
.tv-live-badge { background-color: #ff0000; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; animation: tv-pulse 2s infinite; }
@keyframes tv-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.tv-video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; }
.tv-video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.tv-controls { background-color: #2a2a2a; padding: 15px 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tv-btn { background-color: #e50914; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: all 0.3s; text-decoration: none; display: inline-block; }
.tv-btn:hover { background-color: #f40612; transform: translateY(-2px); }
.tv-btn.tv-secondary { background-color: #444; }
.tv-btn.tv-secondary:hover { background-color: #555; }
</style>

<div class="tv-player-wrapper">
    <div class="tv-player-container">
        <div class="tv-player-header"><h1>📺 Live TV <span class="tv-live-badge">LIVE</span></h1></div>
        <div class="tv-video-wrapper">
            <iframe id="tvStreamFrame" src="${streamUrl}" width="100%" height="100%" style="border:0;" allowfullscreen="" allow="autoplay; fullscreen; encrypted-media"></iframe>
        </div>
        <div class="tv-controls">
            <button class="tv-btn" onclick="document.getElementById('tvStreamFrame').requestFullscreen()">⛶ Fullscreen</button>
            <button class="tv-btn tv-secondary" onclick="document.getElementById('tvStreamFrame').src=document.getElementById('tvStreamFrame').src">🔄 Reload</button>
        </div>
    </div>
</div>`;
        
        document.getElementById('output').value = fullCode;

        // 2. Load the Preview
        document.getElementById('playerContainer').innerHTML = fullCode;
    }

    function copyToClipboard() {
        const output = document.getElementById('output');
        output.select();
        document.execCommand('copy');
        alert("Code copied!");
    }
</script>

</body>
</html>
